name: paper-trade

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so there are several tries. Each run processes any closed
    # session not yet done (buy at close, stop/target check, retrain, email); extra runs are no-ops.
    - cron: "41 10 * * 1-5"  # 16:11 IST
    - cron: "17 13 * * 1-5"  # 18:47 IST
    - cron: "53 16 * * 1-5"  # 22:23 IST
    - cron: "29 21 * * 1-5"  # 02:59 IST next day
    - cron: "7 1 * * 2-6"    # 06:37 IST next day (before the next open)
  workflow_dispatch:
    inputs:
      job:
        description: "Which run"
        type: choice
        options: [eod, entry, email-test, site]
        default: eod

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || 'eod' }}
      SITE_REPO: ${{ github.repository_owner }}/paper-trading-dashboard
      SITE_URL: https://${{ github.repository_owner }}.github.io/paper-trading-dashboard/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/hist.pkl
            data/events.pkl
          key: mkt-${{ github.run_id }}
          restore-keys: mkt-

      - name: Paper trade (${{ env.JOB }})
        if: env.JOB != 'email-test' && env.JOB != 'site'
        run: python papertrade.py job "$JOB"

      - name: Save market data
        if: always() && hashFiles('data/hist.pkl') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data/hist.pkl
            data/events.pkl
          key: mkt-${{ github.run_id }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper reports/paper data/model.joblib data/model_canary.json data/model_config.json data/sec_list.csv data/ind_niftytotalmarket_list.csv
          if ! git diff --cached --quiet; then
            git commit -m "paper trade $JOB $(TZ=Asia/Kolkata date +%F)"
            git pull --rebase
            git push
          fi

      - name: Publish dashboard (results only, no code)
        if: always() && env.JOB != 'email-test'
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -z "$SITE_DEPLOY_KEY" ]; then echo "SITE_DEPLOY_KEY not set - skipping"; exit 0; fi
          python dashboard.py
          mkdir -p ~/.ssh && echo "$SITE_DEPLOY_KEY" > ~/.ssh/site_key && chmod 600 ~/.ssh/site_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o StrictHostKeyChecking=accept-new"
          cd site && git init -q -b main && git add -A
          git -c user.name="paper-trader-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "dashboard $(TZ=Asia/Kolkata date '+%F %H:%M')"
          git push -q -f "git@github.com:${SITE_REPO}.git" main
          echo "published to $SITE_URL"

      - name: Email reports
        if: always()
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python notify.py $([ "$JOB" = email-test ] && echo --test)
